<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zenith | Pacientes</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="shortcut icon" href="/src/img/zenith-logo2.ico">
</head>
<body data-page="patients">
<main id="authView" class="auth-shell hidden">
    <section class="auth-panel">
        <div><img src="/src/img/zenith-logo.png" alt="Logo do Zenith" class="logo"></div>
        <form id="loginForm" class="form-grid">
            <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
            <label>Senha<input name="password" type="password" required autocomplete="current-password"></label>
            <button type="submit">Entrar</button>
        </form>
        <details>
            <summary>Criar primeiro acesso</summary>
            <form id="registerForm" class="form-grid">
                <label>Nome<input name="name" required></label>
                <label>E-mail<input name="email" type="email" required></label>
                <label>Senha<input name="password" type="password" minlength="6" required></label>
                <button type="submit">Cadastrar</button>
            </form>
        </details>
        <p id="authMessage" class="message"></p>
    </section>
</main>

<main id="appView" class="app-shell hidden">
    <aside class="sidebar">
        <img src="/src/img/logo-small.png" alt="Logo do Zenith" class="logo-small">
        <nav>
            <a class="nav-button" data-view="dashboard" href="/dashboard.html">Painel</a>
            <a class="nav-button active" data-view="patients" href="/patients.html">Pacientes</a>
            <a class="nav-button" data-view="appointments" href="/appointments.html">Agenda</a>
            <a class="nav-button" data-view="finance" href="/finance.html">Financeiro</a>
            <a class="nav-button" data-view="documents" href="/documents.html">Documentos</a>
        </nav>
        <button id="logoutButton" class="secondary">Sair</button>
    </aside>
    <section class="workspace">
        <header class="topbar">
            <div><h2 id="viewTitle">Pacientes</h2></div>
            <p id="appMessage" class="message"></p>
        </header>
        <section id="patients" class="view active">
            <form id="patientForm" class="editor">
                <input type="hidden" name="id">
                <label>Nome completo<input name="fullName" required></label>
                <label>Telefone<input name="phone"></label>
                <label>E-mail<input name="email" type="email"></label>
                <label>Nascimento<input name="birthDate" type="date"></label>
                <label>CPF<input name="cpf"></label>
                <label>Valor da sessão<input name="sessionValue" type="number" min="0" step="0.01" placeholder="0,00"></label>
                <label class="wide">Observações clínicas<textarea name="clinicalNotes" rows="3"></textarea></label>
                <button type="submit">Salvar paciente</button>
                <button type="button" class="secondary" data-reset="patientForm">Limpar</button>
            </form>
            <table>
                <thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Sessão</th><th>Ações</th></tr></thead>
                <tbody id="patientsTable"></tbody>
            </table>
        </section>
    </section>
</main>

<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p>Carregando...</p>
</div>

<script src="/js/app.js"></script>
</body>
</html>
