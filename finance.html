<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zenith | Financeiro</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="shortcut icon" href="/src/img/zenith-logo2.ico">
</head>
<body data-page="finance">
<main id="authView" class="auth-shell hidden">
    <section class="auth-panel">
        <div><img src="/src/img/zenith-logo.png" alt="Logo do Zenith" class="logo"></div>
        <form id="loginForm" class="form-grid">
            <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
            <label>Senha<input name="password" type="password" required autocomplete="current-password"></label>
            <button type="submit">Entrar</button>
        </form>
        <details>
            <summary>Criar primeiro acesso</summary>
            <form id="registerForm" class="form-grid">
                <label>Nome<input name="name" required></label>
                <label>E-mail<input name="email" type="email" required></label>
                <label>Senha<input name="password" type="password" minlength="6" required></label>
                <button type="submit">Cadastrar</button>
            </form>
        </details>
        <p id="authMessage" class="message"></p>
    </section>
</main>

<main id="appView" class="app-shell hidden">
    <aside class="sidebar">
        <img src="/src/img/logo-small.png" alt="Logo do Zenith" class="logo-small">
        <nav>
            <a class="nav-button" data-view="dashboard" href="/dashboard.html">Painel</a>
            <a class="nav-button" data-view="patients" href="/patients.html">Pacientes</a>
            <a class="nav-button" data-view="appointments" href="/appointments.html">Agenda</a>
            <a class="nav-button active" data-view="finance" href="/finance.html">Financeiro</a>
            <a class="nav-button" data-view="documents" href="/documents.html">Documentos</a>
        </nav>
        <button id="logoutButton" class="secondary">Sair</button>
    </aside>
    <section class="workspace">
        <header class="topbar">
            <div><h2 id="viewTitle">Financeiro</h2></div>
            <p id="appMessage" class="message"></p>
        </header>
        <section id="finance" class="view active">
            <form id="paymentForm" class="editor">
                <input type="hidden" name="id">
                <label>Paciente<select name="patientId" required></select></label>
                <label>Valor<input name="amount" type="number" min="0.01" step="0.01" required></label>
                <label>Vencimento<input name="dueDate" type="date" required></label>
                <label>Pago em<input name="paidAt" type="date"></label>
                <label>Status<select name="status"><option>PENDENTE</option><option>PAGO</option><option>ATRASADO</option><option>CANCELADO</option></select></label>
                <label>Método<input name="method"></label>
                <label>Referência<input name="reference"></label>
                <label class="wide">Observações<textarea name="notes" rows="3"></textarea></label>
                <button type="submit">Salvar pagamento</button>
                <button type="button" class="secondary" data-reset="paymentForm">Limpar</button>
            </form>
            <table>
                <thead><tr><th>Paciente</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Ações</th></tr></thead>
                <tbody id="paymentsTable"></tbody>
            </table>
        </section>
    </section>
</main>

<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p>Carregando...</p>
</div>

<script src="/js/app.js"></script>
</body>
</html>
