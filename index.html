<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zenith | Entrar</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="shortcut icon" href="/src/img/zenith-logo2.ico">
</head>
<body data-page="login">
<main id="authView" class="auth-shell">
    <section class="auth-panel">
        <div>
            <img src="/src/img/zenith-logo.png" alt="Logo do Zenith" class="logo">
        </div>
        <form id="loginForm" class="form-grid">
            <label>E-mail
                <input name="email" type="email" required autocomplete="email">
            </label>
            <label>Senha
                <input name="password" type="password" required autocomplete="current-password">
            </label>
            <button type="submit">Entrar</button>
        </form>
        <details>
            <summary>Criar primeiro acesso</summary>
            <form id="registerForm" class="form-grid">
                <label>Nome
                    <input name="name" required>
                </label>
                <label>E-mail
                    <input name="email" type="email" required>
                </label>
                <label>Senha
                    <input name="password" type="password" minlength="6" required>
                </label>
                <button type="submit">Cadastrar</button>
            </form>
        </details>
        <p id="authMessage" class="message"></p>
    </section>
</main>

<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
